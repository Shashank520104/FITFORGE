openapi: 3.1.0
info:
  title: FITFORGE Auth Service
  version: 1.0.0
  description: Account registration, access tokens, and rotating refresh sessions.
servers:
  - url: http://localhost:3000
paths:
  /api/v1/auth/register:
    post:
      summary: Register an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: Account created; refresh token is set as an HttpOnly cookie.
        "400":
          description: Invalid request.
        "409":
          description: Email is already registered.
  /api/v1/auth/login:
    post:
      summary: Authenticate an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: Authenticated; refresh token is set as an HttpOnly cookie.
        "400":
          description: Invalid request.
        "401":
          description: Invalid credentials.
  /api/v1/auth/refresh:
    post:
      summary: Rotate the refresh session and issue a new access token
      responses:
        "200":
          description: Session rotated successfully.
        "204":
          description: No refresh session is available.
        "401":
          description: Refresh session is expired or already used.
  /api/v1/auth/logout:
    post:
      summary: Revoke the refresh session
      responses:
        "204":
          description: Session revoked and cookie cleared.
  /api/v1/auth/me:
    get:
      security:
        - bearerAuth: []
      summary: Read the current account
      responses:
        "200":
          description: Current account.
        "401":
          description: Missing or invalid access token.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Credentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 72
